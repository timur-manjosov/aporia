[package]
name = "aporia"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A Monte-Carlo laboratory for counter-intuitive results in probability and game theory"
license = "MIT"
readme = "README.md"
keywords = ["monte-carlo", "probability", "simulation", "paradox", "statistics"]
categories = ["science", "command-line-utilities"]
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
# Seeds are always explicit, so the OS entropy source and thread-local RNG are not needed.
rand = { version = "0.10.3", default-features = false, features = ["std"] }
rand_chacha = "0.10.0"
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.12.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
overflow-checks = true
